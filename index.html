<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Asincrono</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <h1>ESP Web Server</h1>

    <!-- Declaracion de los LEDs -->
    <h4>Conexion</h4>
    <label class="switch">
        <input type="checkbox" onchange="conectarESP32()">
        <span class="slider"></span>
    </label>
    <div class="la_tablita">
        <h3>Jugador 1: <span id="Player1">0</span></h3>
        <h3>Jugador 2: <span id="Player2">0</span></h3>
    </div>
    <div id="quiengano">
        ¡Ganó el Jugador <span id="WinPlayerId"></span>!
    </div>
    <canvas id="juego"></canvas>
    
    <script src="ping-pomg.js"></script>
    <img src="Ping-Pong-Download-PNG.png" alt="The design team collaborating" width="600">
</body>
</html>
